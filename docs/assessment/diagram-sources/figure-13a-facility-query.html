middle">Show cached facilities</text><text x="984" y="166" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Same rounded coordinate key</text><text x="984" y="191" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">10-minute memory cache</text><text x="935.0" y="151.0" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">yes</text><text x="700.0" y="386" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">Next coordinate box</text><text x="514" y="414" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">0.012 → 0.03 → 0.06 degrees</text><text x="748" y="298" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">no</text><text x="1030" y="300" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">refresh</text><text x="230.0" y="386" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">OverpassFacilities.near</text><text x="44" y="414" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Query OSM facility tags</text><text x="44" y="439" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Hedge requests across four mirrors</text><text x="44" y="464" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">First valid JSON aborts other requests</text><text x="230.0" y="692.0" font-family="Inter" font-size="19" font-weight="600" fill="#D42140" text-anchor="middle">Ring succeeded?</text><text x="700.0" y="654" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Merge and show partial results</text><text x="514" y="682" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Deduplicate by id; sort by distance</text><text x="465.0" y="667.0" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">yes</text><text x="1170.0" y="692.0" font-family="Inter" font-size="19" font-weight="600" fill="#D42140" text-anchor="middle">Another ring?</text><text x="230.0" y="940.0" font-family="Inter" font-size="19" font-weight="600" fill="#D42140" text-anchor="middle">Earlier ring answered?</text><text x="268" y="822" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">no</text><text x="772" y="798" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">yes: continue</text><text x="1170" y="552" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">yes</text><text x="935.0" y="1146" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Finish search</text><text x="514" y="1174" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Answered: cache nonempty results; show an empty or wider-search notice if needed.</text><text x="514" y="1199" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">No answered ring: show the error; retain displayed results and mark stale.</text><text x="1318" y="1080" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">no</text><text x="356" y="1192" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">no: stop</text><polyline points="28,1320 1372,1320" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="1354" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Warm results are shown immediately and refreshed. A first-ring failure stops the loop; after any successful ring, a failed wider ring allows the next attempt.</text><text x="28" y="1379" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">PulsePoint queries an API, not HTML. GET network failure may trigger POST fallback; abort and an HTTP error alone do not. Outdated search runs are</text><text x="28" y="1404" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">ignored.</text></svg></html>
