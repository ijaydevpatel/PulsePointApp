<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1029" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Local SQLite schema</title><desc id="diagram-desc">Source-verified PulsePoint Android diagram. Connector roles are recorded in the audit manifest.</desc><polyline points="752,340 700,340 700,180 648,180" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4"/><polyline points="662.0,174.0 648,180 662.0,186.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><rect x="28" y="112" width="620" height="410" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="752" y="112" width="620" height="242" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="752" y="618" width="620" height="206" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><polyline points="28,190 648,190" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><polyline points="752,190 1372,190" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><rect x="846.5" y="519" width="151.0" height="26" rx="0" fill="#FFFFFF" stroke="none"/><text x="28" y="30" font-family="Consolas" font-size="16" font-weight="400" fill="#D42140" text-anchor="start">PULSEPOINT / ANDROID</text><text x="28" y="72" font-family="Playfair Display" font-size="32" font-weight="400" fill="#0A0A0A" text-anchor="start">Local SQLite schema</text><text x="338.0" y="137" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«table»</text><text x="338.0" y="171" font-family="Inter" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">episodes</text><text x="42" y="218" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">PK id: TEXT NOT NULL</text><text x="42" y="242" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">captured_at: TEXT NOT NULL</text><text x="42" y="266" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">age_band: TEXT NOT NULL</text><text x="42" y="290" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">duration_hours: INTEGER NOT NULL</text><text x="42" y="314" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">symptoms_json: TEXT NOT NULL</text><text x="42" y="338" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">band: TEXT NOT NULL</text><text x="42" y="362" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">severity: INTEGER NOT NULL</text><text x="42" y="386" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">confidence: REAL NOT NULL</text><text x="42" y="410" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">source: TEXT NOT NULL</text><text x="42" y="434" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">red_flags_json: TEXT NOT NULL</text><text x="42" y="458" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">rationale_json: TEXT NOT NULL</text><text x="42" y="482" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">sync_status: TEXT NOT NULL</text><text x="42" y="506" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">analysis_json: TEXT NULL</text><text x="1062.0" y="137" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«table»</text><text x="1062.0" y="171" font-family="Inter" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">activity</text><text x="766" y="218" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">PK id: TEXT NOT NULL</text><text x="766" y="242" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">kind: TEXT NOT NULL</text><text x="766" y="266" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">at: TEXT NOT NULL</text><text x="766" y="290" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">title: TEXT NOT NULL</text><text x="766" y="314" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">detail: TEXT NULL</text><text x="766" y="338" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">episode_id: TEXT NULL</text><text x="922" y="540" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">logical id link</text><text x="1062.0" y="644" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Application-managed relationship</text><text x="768" y="672" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">activity.episode_id may identify episodes.id.</text><text x="768" y="697" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">No SQL FOREIGN KEY constraint is declared.</text><text x="768" y="722" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">remove(id) explicitly deletes matching activity.</text><text x="768" y="747" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">clear() and clearActivity() are separate calls.</text><polyline points="28,900 1372,900" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="934" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Schema version 3 adds analysis_json. Episodes store JSON-valued symptom, red-flag and rationale fields; these are not separate SQL tables.</text><text x="28" y="959" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">The store issues PRAGMA key and saves its generated key in SecureStore. SQLCipher build support is not enabled in the checked configuration.</text><text x="28" y="984" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Dashed id link is not a database-enforced foreign key. Runtime encryption of an installed binary has not been verified.</text></svg>