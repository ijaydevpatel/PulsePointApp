<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1580" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Verified Git change history</title><desc id="diagram-desc">Source-verified PulsePoint Android diagram. Connector roles are recorded in the audit manifest.</desc><rect x="28" y="112" width="1344" height="98" rx="6" fill="#FDEEF1" stroke="#D42140"/><rect x="28" y="224" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="336" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="448" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="560" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="672" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="784" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="896" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="1008" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="1120" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="1232" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="1344" width="1344" height="98" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><text x="28" y="30" font-family="Consolas" font-size="16" font-weight="400" fill="#D42140" text-anchor="start">PULSEPOINT / ANDROID</text><text x="28" y="72" font-family="Playfair Display" font-size="32" font-weight="400" fill="#0A0A0A" text-anchor="start">Verified Git change history</text><text x="700.0" y="138" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">5a8fa2b / 2026-10-01</text><text x="44" y="166" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Label every place, and move labels rather than dropping them</text><text x="700.0" y="250" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">4b0a802 / 2026-10-01</text><text x="44" y="278" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Revert &quot;Put the place names in pills&quot;</text><text x="700.0" y="362" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">f65565b / 2026-10-01</text><text x="44" y="390" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Put the place names in pills</text><text x="700.0" y="474" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">4e24c1b / 2026-10-01</text><text x="44" y="502" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Draw pins from plain properties so the labels render</text><text x="700.0" y="586" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">8fd0a42 / 2026-10-01</text><text x="44" y="614" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Say when the wider search fails, and warm the first ring at launch</text><text x="700.0" y="698" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">6e65225 / 2026-10-01</text><text x="44" y="726" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Keep widening after a ring fails, and label pins sooner</text><text x="700.0" y="810" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">5c8a1f1 / 2026-10-01</text><text x="44" y="838" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Ask Overpass over GET, and fall back to POST</text><text x="700.0" y="922" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">14e3fb8 / 2026-10-01</text><text x="44" y="950" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Report which mirror failed and how</text><text x="700.0" y="1034" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">2a6db08 / 2026-10-01</text><text x="44" y="1062" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Race the mirrors, keep the last good list, and fence the tests out of the bundle</text><text x="700.0" y="1146" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">1de930b / 2026-10-01</text><text x="44" y="1174" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Make the map fail fast and answer sooner</text><text x="700.0" y="1258" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">1250bda / 2026-09-30</text><text x="44" y="1286" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Fill the map in as results arrive</text><text x="700.0" y="1370" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">18caf0a / 2026-09-30</text><text x="44" y="1398" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Fix deleted records lingering, and show the analysis on a record</text><polyline points="28,1476 1372,1476" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="1510" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Extract: git log -12 --date=short --format=&quot;%h | %ad | %s&quot;; checked on 1 October 2026.</text><text x="28" y="1535" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Commits establish changes to the repository. They do not establish sprint boundaries, meetings, reviews or device-test outcomes.</text></svg>