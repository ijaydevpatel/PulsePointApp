<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 964" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Triage band and result status logic</title><desc id="diagram-desc">Source-verified PulsePoint Android diagram. Connector roles are recorded in the audit manifest.</desc><polyline points="432,169.0 498,169.0" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round"/><polyline points="484.0,175.0 498,169.0 484.0,163.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><polyline points="902,169.0 1040,169.0" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1026.0,175.0 1040,169.0 1026.0,163.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><polyline points="1184.0,226 1184.0,360" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1178.0,346.0 1184.0,360 1190.0,346.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><polyline points="1184.0,112 1184,96 940,96 940,413 902,413" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round"/><polyline points="916.0,407.0 902,413 916.0,419.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><polyline points="700.0,466 700.0,600" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round"/><polyline points="694.0,586.0 700.0,600 706.0,586.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><polyline points="1184.0,466 1184,552 822,552 822,600" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round"/><polyline points="816.0,586.0 822,600 828.0,586.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><circle cx="940" cy="169.0" r="5" fill="#FFFFFF" stroke="none"/><polyline points="940,161.0 940,177.0" fill="none" stroke="#5C6273" stroke-width="1.5" stroke-linejoin="round"/><rect x="28" y="112" width="404" height="114" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="498" y="112" width="404" height="114" rx="6" fill="#FDEEF1" stroke="#D42140"/><polygon points="1184.0,112 1328,169.0 1184.0,226 1040,169.0" fill="#FDEEF1" stroke="#D42140"/><rect x="1040" y="360" width="288" height="106" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="498" y="360" width="404" height="106" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="498" y="600" width="404" height="202" rx="6" fill="#FDEEF1" stroke="#D42140"/><rect x="1213.0" y="277" width="34.0" height="26" rx="0" fill="#FFFFFF" stroke="none"/><rect x="936.5" y="271" width="43.0" height="26" rx="0" fill="#FFFFFF" stroke="none"/><text x="28" y="30" font-family="Consolas" font-size="16" font-weight="400" fill="#D42140" text-anchor="start">PULSEPOINT / ANDROID</text><text x="28" y="72" font-family="Playfair Display" font-size="32" font-weight="400" fill="#0A0A0A" text-anchor="start">Triage band and result status logic</text><text x="230.0" y="138" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Evaluate episode</text><text x="44" y="166" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">detectRedFlags + classify</text><text x="700.0" y="138" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">Scored band</text><text x="514" y="166" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">≥80 Emergency; ≥55 Urgent</text><text x="514" y="191" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">≥25 Pharmacy / GP; else Self care</text><text x="1184.0" y="176.0" font-family="Inter" font-size="19" font-weight="600" fill="#D42140" text-anchor="middle">Flag band exists?</text><text x="1184.0" y="386" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Keep scored band</text><text x="700.0" y="386" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Take higher urgency</text><text x="514" y="414" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">maxBand(flag, scored)</text><text x="1230" y="298" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">no</text><text x="958" y="292" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">yes</text><text x="700.0" y="626" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">Save and return TriageResult</text><text x="514" y="654" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Rule adapter: ON_DEVICE_RULES</text><text x="514" y="679" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Initial status: PENDING_SYNC</text><text x="514" y="704" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Emergency flag: severity at least 85</text><text x="514" y="729" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Any flag: confidence at least 0.9</text><polyline points="28,860 1372,860" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="894" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Severity thresholds are checked in descending order. A red flag cannot lower the scored urgency.</text><text x="28" y="919" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">PENDING_SYNC is a stored value. A background history-sync job is not implemented in this checkout.</text></svg>