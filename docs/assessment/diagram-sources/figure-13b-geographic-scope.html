<!doctype html><html lang="en"><meta charset="utf-8"><title>Facility query geographic scope</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Playfair+Display:wght@400&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:white}svg{display:block;width:100%}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 908" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Facility query geographic scope</title><desc id="diagram-desc">Source-verified PulsePoint Android diagram. Connector roles are recorded in the audit manifest.</desc><rect x="90.0" y="150.0" width="580" height="580" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="195.0" y="255.0" width="370" height="370" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="300.0" y="360.0" width="160" height="160" rx="0" fill="#FDEEF1" stroke="#D42140"/><circle cx="380" cy="440" r="6" fill="#D42140" stroke="none"/><rect x="752" y="150" width="620" height="220" rx="6" fill="#FDEEF1" stroke="#D42140"/><rect x="752" y="430" width="620" height="210" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><text x="28" y="30" font-family="Consolas" font-size="16" font-weight="400" fill="#D42140" text-anchor="start">PULSEPOINT / ANDROID</text><text x="28" y="72" font-family="Playfair Display" font-size="32" font-weight="400" fill="#0A0A0A" text-anchor="start">Facility query geographic scope</text><text x="380" y="164" font-family="Consolas" font-size="18" font-weight="400" fill="#5C6273" text-anchor="middle">±0.06° latitude / longitude</text><text x="380" y="280" font-family="Consolas" font-size="18" font-weight="400" fill="#5C6273" text-anchor="middle">±0.03° latitude / longitude</text><text x="380" y="390" font-family="Consolas" font-size="18" font-weight="400" fill="#5C6273" text-anchor="middle">±0.012°</text><text x="380" y="470" font-family="Inter" font-size="17" font-weight="600" fill="#D42140" text-anchor="middle">Device coordinate</text><text x="1062.0" y="176" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«query extent»</text><text x="1062.0" y="200" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">Bounding box formula</text><text x="768" y="228" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">south = latitude − radiusDeg</text><text x="768" y="253" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">north = latitude + radiusDeg</text><text x="768" y="278" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">west = longitude − radiusDeg</text><text x="768" y="303" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">east = longitude + radiusDeg</text><text x="1062.0" y="456" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Progressive coverage</text><text x="768" y="484" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">CareScreen queries all three boxes in sequence.</text><text x="768" y="509" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">These are coordinate degrees, not circular km radii.</text><text x="768" y="534" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Distance is calculated for returned facilities.</text><text x="768" y="559" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Any valid device coordinate can be searched.</text><polyline points="28,804 1372,804" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="838" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">The schematic is not a geographic map and is not drawn to physical distance scale. Longitude degree distance varies with latitude.</text><text x="28" y="863" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">The repository has no hard-coded Auckland or New Zealand boundary. Results depend on OSM tags, data coverage and mirror availability.</text></svg></html>
