amily="Inter" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">ProbableCondition</text><text x="512" y="758" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">+ name: string</text><text x="512" y="782" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">+ confidence: number</text><text x="512" y="806" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">+ severity: MatrixSeverity</text><text x="1170.0" y="677" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«interface»</text><text x="1170.0" y="711" font-family="Inter" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">TreatmentPathways</text><text x="982" y="758" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">+ allopathy: readonly string[]</text><text x="982" y="782" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">+ homeopathic: readonly string[]</text><text x="982" y="806" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">+ homeRemedies: readonly string[]</text><text x="230.0" y="677" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«type»</text><text x="230.0" y="711" font-family="Inter" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">MatrixSeverity</text><text x="42" y="758" font-family="Consolas" font-size="18" font-weight="400" fill="#0A0A0A" text-anchor="start">Critical | High | Medium | Low</text><text x="742" y="617.1645569620254" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">probabilityMatrix: 0..*</text><polyline points="28,900 1372,900" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="934" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">HistoryEntry retains episode, result and optional remote-analysis values. Remote analysis contains a condition list and treatment-pathway value.</text><text x="28" y="959" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Figure 10 defines the remaining triage fields and their types. The source catalogue gives every locally declared class and complete interface signatures.</text></svg>