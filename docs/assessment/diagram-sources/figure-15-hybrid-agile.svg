width="412" height="108" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="496" y="350" width="412" height="108" rx="6" fill="#FDEEF1" stroke="#D42140"/><rect x="936" y="350" width="412" height="108" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="56" y="546" width="302" height="106" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="386" y="546" width="302" height="106" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="716" y="546" width="302" height="106" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="1046" y="546" width="302" height="106" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><text x="28" y="30" font-family="Consolas" font-size="16" font-weight="400" fill="#D42140" text-anchor="start">PULSEPOINT / ANDROID</text><text x="28" y="72" font-family="Playfair Display" font-size="32" font-weight="400" fill="#0A0A0A" text-anchor="start">Mobile-D phases with Scrum ceremonies</text><text x="164" y="156" font-family="Inter" font-size="21" font-weight="600" fill="#0A0A0A" text-anchor="middle">Explore</text><text x="164" y="194" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">W1</text><text x="434" y="156" font-family="Inter" font-size="21" font-weight="600" fill="#0A0A0A" text-anchor="middle">Initialise</text><text x="434" y="194" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">W2</text><text x="704" y="156" font-family="Inter" font-size="21" font-weight="600" fill="#D42140" text-anchor="middle">Productionise</text><text x="704" y="194" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">W3–W7</text><text x="974" y="156" font-family="Inter" font-size="21" font-weight="600" fill="#0A0A0A" text-anchor="middle">Stabilise</text><text x="974" y="194" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">W8</text><text x="1244" y="156" font-family="Inter" font-size="21" font-weight="600" fill="#0A0A0A" text-anchor="middle">System test + fix</text><text x="1244" y="194" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">Within Stabilise</text><text x="44" y="318" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="start">PRODUCTIONISE / three sequential sprints</text><text x="262.0" y="376" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Sprint 1</text><text x="72" y="404" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">W3–W4 / triage</text><text x="702.0" y="376" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">Sprint 2</text><text x="512" y="404" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">W5–W6 / Care map</text><text x="1142.0" y="376" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Sprint 3</text><text x="952" y="404" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">W7 / Records + profile</text><text x="207.0" y="572" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Planning</text><text x="72" y="600" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Goal + backlog</text><text x="537.0" y="572" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Daily build</text><text x="402" y="600" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Gates + device test</text><text x="867.0" y="572" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Review</text><text x="732" y="600" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Demonstrate increment</text><text x="1197.0" y="572" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Retrospective</text><text x="1062" y="600" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Improve next sprint</text><polyline points="28,750 1372,750" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="784" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">The phase strip gives project scope; the inset expands Productionise. System test and fix is folded into the Week 8 Stabilise phase.</text><text x="28" y="809" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">A solo project adapts Scrum ceremonies; it does not claim a separate Scrum Team or Scrum Master. The schedule is a report plan, not a reconstruction of Git</text><text x="28" y="834" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">activity.</text></svg>