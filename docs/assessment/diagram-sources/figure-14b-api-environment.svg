idth="1.5" stroke-linejoin="round" stroke-dasharray="6,4"/><polyline points="1106.0,701.0 1120,695 1106.0,689.0" fill="none" stroke="#5C6273" stroke-width="1.5"/><rect x="630" y="386" width="400" height="300" rx="6" fill="#FDEEF1" stroke="#D42140"/><rect x="28" y="112" width="490" height="112" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="250" width="490" height="112" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="388" width="490" height="112" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="526" width="490" height="112" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="664" width="490" height="112" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="802" width="490" height="112" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><polygon points="1120,310 1136,298 1388,298 1372,310" fill="#F7F7F9" stroke="#B8BDC9"/><polygon points="1372,310 1388,298 1388,452 1372,464" fill="#F7F7F9" stroke="#B8BDC9"/><rect x="1120" y="310" width="252" height="154" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="1120" y="618" width="252" height="154" rx="6" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="1044.5" y="347" width="61.0" height="26" rx="0" fill="#FFFFFF" stroke="none"/><text x="28" y="30" font-family="Consolas" font-size="16" font-weight="400" fill="#D42140" text-anchor="start">PULSEPOINT / ANDROID</text><text x="28" y="72" font-family="Playfair Display" font-size="32" font-weight="400" fill="#0A0A0A" text-anchor="start">Remote API adapter environment</text><text x="830.0" y="412" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«class»</text><text x="830.0" y="436" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">ApiClient</text><text x="646" y="464" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">One shared instance</text><text x="646" y="489" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Base URL and fetchImpl</text><text x="646" y="514" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">TokenProvider callback</text><text x="646" y="539" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Typed JSON + timeout / errors</text><text x="273.0" y="138" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«class»</text><text x="273.0" y="162" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">RemoteSymptomAnalysis</text><text x="44" y="190" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">private api: ApiClient</text><text x="273.0" y="276" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«class»</text><text x="273.0" y="300" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">RemoteMedicineCheck</text><text x="44" y="328" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">private api: ApiClient</text><text x="273.0" y="414" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«class»</text><text x="273.0" y="438" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">RemoteChat</text><text x="44" y="466" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">private api: ApiClient</text><text x="273.0" y="552" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«class»</text><text x="273.0" y="576" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">RemoteNews</text><text x="44" y="604" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">private api: ApiClient</text><text x="273.0" y="690" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«class»</text><text x="273.0" y="714" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">RemoteDashboard</text><text x="44" y="742" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">private api: ApiClient</text><text x="273.0" y="828" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«class»</text><text x="273.0" y="852" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">RemoteProfile</text><text x="44" y="880" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">private api: ApiClient</text><text x="1246.0" y="336" font-family="Consolas" font-size="16" font-weight="400" fill="#5C6273" text-anchor="middle">«node»</text><text x="1246.0" y="360" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">PulsePoint API</text><text x="1136" y="388" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Remote endpoints</text><text x="1136" y="413" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">HTTPS + JSON</text><text x="1075" y="368" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">HTTPS</text><text x="1246.0" y="644" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Clerk token</text><text x="1246.0" y="672" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">provider</text><text x="1136" y="700" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">useAuth().getToken</text><text x="1136" y="725" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Bearer auth</text><polyline points="28,980 1372,980" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="1014" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Each adapter retains the same ApiClient instance supplied by createServices. No adapter-to-adapter references are implied.</text><text x="28" y="1039" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">OverpassFacilities and OpenMeteoConditions use independent fetch integrations. Server-side database and hosting details cannot be established from this</text><text x="28" y="1064" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Android source.</text></svg>