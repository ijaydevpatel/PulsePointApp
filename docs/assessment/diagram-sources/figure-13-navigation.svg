amily="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">readiness</text><text x="438.0" y="138" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Auth</text><text x="344" y="166" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Guest state</text><text x="288" y="140" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">guest</text><text x="44" y="340" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="start">TAB SHELL / select any of five tabs</text><text x="136.0" y="392" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Home</text><text x="336.0" y="392" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Symptoms</text><text x="536.0" y="392" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Medicines</text><text x="736.0" y="392" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">AI Doctor</text><text x="936.0" y="392" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Care / Map</text><text x="156" y="282" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">session ready</text><text x="510" y="272" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">signed in</text><text x="1256.0" y="336" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Profile</text><text x="1156" y="364" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Header button</text><text x="1256.0" y="532" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Settings</text><text x="1156" y="560" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Replaces Profile</text><text x="1094" y="342" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">open / Back</text><text x="1318" y="466" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">replace</text><text x="336.0" y="676" font-family="Inter" font-size="23" font-weight="600" fill="#D42140" text-anchor="middle">Triage result</text><text x="260" y="704" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">ResultScreen</text><text x="536.0" y="676" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Interactions</text><text x="460" y="704" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">CollisionScreen</text><text x="936.0" y="676" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Facility</text><text x="936.0" y="704" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">sheet</text><text x="860" y="732" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Care inline state</text><text x="1256.0" y="746" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Records</text><text x="1156" y="774" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">Overlay, not a tab</text><text x="334" y="554" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">submit / Back</text><text x="536" y="590" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">check / Back</text><text x="936" y="594" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">select / close</text><text x="602" y="814" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">Find care: clear stack</text><text x="1270" y="680" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">Open Records</text><text x="1234" y="854" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">Back: origin tab</text><text x="1104" y="638" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">Back</text><text x="1050" y="104" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">sign out → Auth</text><text x="936.0" y="964" font-family="Inter" font-size="23" font-weight="600" fill="#0A0A0A" text-anchor="middle">Maps app</text><text x="860" y="992" font-family="Inter" font-size="19" font-weight="400" fill="#5C6273" text-anchor="start">External handoff</text><text x="936" y="888" font-family="Consolas" font-size="17" font-weight="400" fill="#5C6273" text-anchor="middle">Directions</text><polyline points="28,1094 1372,1094" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="1128" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">Double-headed = open / Back or reversible inline selection. Profile ↔ Settings replaces the overlay; Records Back returns to the origin tab.</text><text x="28" y="1153" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">TabBar selects any tab and clears overlays; Home also has a Start check shortcut. Android Back pops an overlay, then returns a non-Home tab to Home.</text><text x="28" y="1178" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">News and check-in overlay routes have no entry from the rendered tab controls. AI Doctor directly renders ChatScreen.</text></svg>