<!doctype html><html lang="en"><meta charset="utf-8"><title>Expected outcomes and evidence</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Playfair+Display:wght@400&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:white}svg{display:block;width:100%}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 668" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Expected outcomes and evidence</title><desc id="diagram-desc">Source-verified PulsePoint Android diagram. Connector roles are recorded in the audit manifest.</desc><rect x="28" y="112" width="270" height="56" rx="0" fill="#0A0A0A" stroke="#B8BDC9"/><rect x="298" y="112" width="534" height="56" rx="0" fill="#0A0A0A" stroke="#B8BDC9"/><rect x="832" y="112" width="540" height="56" rx="0" fill="#0A0A0A" stroke="#B8BDC9"/><rect x="28" y="168" width="270" height="82" rx="0" fill="#F7F7F9" stroke="#B8BDC9"/><rect x="298" y="168" width="534" height="82" rx="0" fill="#F7F7F9" stroke="#B8BDC9"/><rect x="832" y="168" width="540" height="82" rx="0" fill="#F7F7F9" stroke="#B8BDC9"/><rect x="28" y="250" width="270" height="82" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="298" y="250" width="534" height="82" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="832" y="250" width="540" height="82" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="28" y="332" width="270" height="82" rx="0" fill="#F7F7F9" stroke="#B8BDC9"/><rect x="298" y="332" width="534" height="82" rx="0" fill="#F7F7F9" stroke="#B8BDC9"/><rect x="832" y="332" width="540" height="82" rx="0" fill="#F7F7F9" stroke="#B8BDC9"/><rect x="28" y="414" width="270" height="108" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="298" y="414" width="534" height="108" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><rect x="832" y="414" width="540" height="108" rx="0" fill="#FFFFFF" stroke="#B8BDC9"/><text x="28" y="30" font-family="Consolas" font-size="16" font-weight="400" fill="#D42140" text-anchor="start">PULSEPOINT / ANDROID</text><text x="28" y="72" font-family="Playfair Display" font-size="32" font-weight="400" fill="#0A0A0A" text-anchor="start">Expected outcomes and evidence</text><text x="44" y="140" font-family="Inter" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Outcome</text><text x="314" y="140" font-family="Inter" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">PulsePoint behavior</text><text x="848" y="140" font-family="Inter" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Evidence / remaining check</text><text x="44" y="196" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Explain urgency</text><text x="314" y="196" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Rule band, rationale and red flags are returned locally.</text><text x="848" y="196" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">442 automated tests pass. These checks do not</text><text x="848" y="222" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">establish clinical accuracy.</text><text x="44" y="278" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Find nearby care</text><text x="314" y="278" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Progressive facility results, distance and maps handoff.</text><text x="848" y="278" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Live coverage depends on OSM and network. The report</text><text x="848" y="304" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">records a populated-area device check.</text><text x="44" y="360" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Retain records</text><text x="314" y="360" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Local episode and activity history; encryption is</text><text x="314" y="386" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">requested by the store.</text><text x="848" y="360" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Restart / delete checks reported. SQLCipher build</text><text x="848" y="386" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">support is unconfirmed; memory fallback is session-local.</text><text x="44" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Maintain the release</text><text x="314" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Typed contracts and automated development gates.</text><text x="848" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">Type, boundary and 84 contrast checks pass. Device</text><text x="848" y="468" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">timing, cold start, memory and battery need</text><text x="848" y="494" font-family="Inter" font-size="19" font-weight="400" fill="#0A0A0A" text-anchor="start">measurements.</text><polyline points="28,564 1372,564" fill="none" stroke="#B8BDC9" stroke-width="1" stroke-linejoin="round"/><text x="28" y="598" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">The local store requests an encryption key; native SQLCipher support has not been verified. Account history sync is not present.</text><text x="28" y="623" font-family="Inter" font-size="18" font-weight="400" fill="#5C6273" text-anchor="start">The result screen gives band advice and red-flag explanations. No user-rating feature is included.</text></svg></html>
